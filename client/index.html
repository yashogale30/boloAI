<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <title>Anuvaad: Hindi to English, live</title>
  </head>
  <body>
    <main>
      <header>
        <div class="brand">
          <div>
            <h1>Anuvaad</h1>
          </div>
        </div>
        <!-- <span id="status" class="pill idle">Idle</span> -->
      </header>

      <section class="session" aria-label="Live translation session">
        <div class="session-intro">
          <h2>Speak naturally.</h2>
          <p>Anuvaad translates Hindi into English while you talk.</p>
          <div class="mode" role="radiogroup" aria-label="Output mode">
            <label><input type="radio" name="mode" value="earbuds" checked /><span>Earbuds</span></label>
            <label><input type="radio" name="mode" value="speaker" /><span>Speaker</span></label>
          </div>
          <p class="sr-only" id="modeHint">Earbuds keep the mic open while English plays.</p>
          <button id="start" class="primary"><span>Start translating</span><span class="button-arrow">→</span></button>
          <button id="demo" class="link">Try a sample conversation <span>→</span></button>
        </div>

        <div class="listening-panel">
          <div class="section-head">
            <p class="section-title">Hindi</p>
          </div>
          <p id="hindi" class="hindi"><span class="final"></span><span class="interim"></span><span class="empty-state">Your Hindi transcript will appear here.</span></p>
          <div class="meter" aria-label="Microphone level"><div id="level"></div></div>
        </div>
      </section>

      <section class="translation-card" aria-live="polite">
        <div class="section-head translation-head">
          <p class="section-title">English</p>
        </div>
        <!-- <ol id="segments" class="segments"><li class="placeholder"><div class="seg-en">Your translated conversation will collect here.</div><div class="seg-hi">Start when you’re ready.</div></li></ol> -->
      </section>

      <section class="latency" aria-label="Translation performance">
        <div class="metric big">
          <span class="metric-name">Current delay</span>
          <span><span id="lastLat" class="value">–</span><span class="unit">s</span></span>
        </div>
        <div class="metric">
          <span class="metric-name">Average</span>
          <span><span id="avgLat" class="value">–</span><span class="unit">s</span></span>
        </div>
        <div class="metric">
          <span class="metric-name">Segments</span>
          <span id="count" class="value">0</span>
        </div>
        <!-- <div id="breakdown" class="breakdown"><span class="breakdown-icon">↗</span> STT – · Translate – · Voice –</div> -->
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
